name: lint
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/context-cache-improvements]
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.3.0
      - name: hooks on the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=origin/main
          fi
          pre-commit run --show-diff-on-failure --from-ref "$BASE" --to-ref HEAD
